<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 44" width="260" height="44" fill="none">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="logoCheckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- 38x38 Brand Icon Mark -->
  <g transform="translate(0, 3)">
    <!-- Base Squircle -->
    <rect width="38" height="38" rx="9" fill="url(#logoBgGrad)"/>
    <rect x="0.5" y="0.5" width="37" height="37" rx="8.5" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

    <!-- Medical Shield & Document -->
    <g filter="url(#logoShadow)" transform="matrix(0.59375 0 0 0.59375 0 0)">
      <path d="M22 17 C22 17 32 14 32 14 C32 14 42 17 42 17 C42 30 38 41 32 47 C26 41 22 30 22 17 Z" 
            fill="#ffffff" fill-opacity="0.96"/>
      
      <!-- Medical Cross -->
      <path d="M29 20 H35 V24 H39 V29 H35 V33 H29 V29 H25 V24 H29 Z" 
            fill="#1d4ed8"/>
      
      <!-- Bill Line Accents -->
      <rect x="27" y="36" width="10" height="2" rx="1" fill="#93c5fd"/>
      <rect x="28" y="40" width="8" height="2" rx="1" fill="#93c5fd"/>
      
      <!-- Verified Emerald Checkmark -->
      <path d="M29 34 L35 40 L47 24" 
            fill="none" 
            stroke="url(#logoCheckGrad)" 
            stroke-width="4.5" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Typography -->
  <text x="48" y="29" font-family="'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.02em" fill="#0f172a">Medical Bill</text>
  <text x="168" y="29" font-family="'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.02em" fill="#1d4ed8">Explainer</text>
</svg>
