<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- App Icon Base -->
  <rect width="64" height="64" rx="15" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border highlight -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>

  <!-- Shield / Document Silhouette -->
  <g filter="url(#shadow)">
    <!-- Shield Outline -->
    <path d="M22 17 C22 17 32 14 32 14 C32 14 42 17 42 17 C42 30 38 41 32 47 C26 41 22 30 22 17 Z" 
          fill="#ffffff" fill-opacity="0.95"/>
    
    <!-- Medical Cross Emblem -->
    <path d="M29 20 H35 V24 H39 V29 H35 V33 H29 V29 H25 V24 H29 Z" 
          fill="#1d4ed8"/>
    
    <!-- Bill Line Accents -->
    <rect x="27" y="36" width="10" height="2" rx="1" fill="#93c5fd"/>
    <rect x="28" y="40" width="8" height="2" rx="1" fill="#93c5fd"/>
    
    <!-- Verified Emerald Checkmark -->
    <path d="M29 34 L35 40 L47 24" 
          fill="none" 
          stroke="url(#checkGrad)" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
</svg>
